<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하모니즈 공식 프로 점수 계산기 | Harmonies Pro Master Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f2ede4;
            --container-bg: #fffcf7;
            --primary-forest: #2b3f27;
            --primary-forest-hover: #1e2c1b;
            --accent-gold: #c28e38;
            --accent-gold-light: #f7f1e3;
            --text-main: #2c2520;
            --text-muted: #7a6e61;
            --border-line: #e3d7c6;
            --card-bg: #ffffff;
            --shadow-subtle: 0 12px 40px rgba(43, 63, 39, 0.08);
            --shadow-card: 0 4px 16px rgba(44, 37, 32, 0.04);
            --radius-main: 24px;
            --radius-card: 16px;
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-canvas); 
            background-image: radial-gradient(#d4c7b0 0.8px, transparent 0.8px);
            background-size: 28px 28px;
            padding: 30px 16px; 
            margin: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--text-main); 
            min-height: 100vh;
        }

        .container { 
            background: var(--container-bg); 
            padding: 36px 30px; 
            border-radius: var(--radius-main); 
            box-shadow: var(--shadow-subtle); 
            width: 100%; 
            max-width: 580px; 
            border: 1.5px solid var(--border-line); 
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #2b3f27, #c28e38, #2b3f27);
            border-top-left-radius: var(--radius-main);
            border-top-right-radius: var(--radius-main);
        }

        .header-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-brand .sub-title {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 6px;
        }

        h2 { 
            margin: 0; 
            color: var(--primary-forest); 
            font-size: 1.8em; 
            font-family: 'Playfair Display', serif, 'Pretendard';
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-desc {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* 참가자 관리 섹션 */
        .manage-section {
            background: #fbf8f2;
            border: 1px solid var(--border-line);
            padding: 20px;
            border-radius: var(--radius-card);
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
        }

        .manage-title {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary-forest);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-add-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .name-input {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid var(--border-line);
            border-radius: 12px;
            font-size: 0.95em;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s ease;
        }

        .name-input:focus {
            border-color: var(--primary-forest);
            box-shadow: 0 0 0 4px rgba(43, 63, 39, 0.08);
        }

        .add-btn {
            background: var(--primary-forest);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .add-btn:hover { background: var(--primary-forest-hover); }
        .add-btn:active { transform: scale(0.97); }

        .player-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-tag {
            background: #fff;
            border: 1.5px solid var(--border-line);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-card);
            color: var(--primary-forest);
        }

        .player-tag input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--primary-forest);
            width: 80px;
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .player-tag input:focus {
            background: #f2ede4;
            border: 1px dashed var(--accent-gold);
        }

        .tag-del {
            color: #d9534f;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.15em;
            line-height: 1;
            transition: opacity 0.2s;
        }
        .tag-del:hover { opacity: 0.7; }

        .empty-notice {
            text-align: center;
            color: var(--text-muted);
            padding: 14px;
            font-size: 0.88em;
            font-style: italic;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .reset-btn {
            background: transparent;
            color: #d9534f;
            border: 1px solid #f2dede;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #fdf7f7;
            border-color: #d9534f;
        }

        /* 카테고리별 카드 스타일 */
        .category-section { 
            border: 1px solid var(--border-line); 
            padding: 20px; 
            margin-bottom: 18px; 
            border-radius: var(--radius-card); 
            background: var(--card-bg); 
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s;
        }

        .category-section:hover {
            border-color: #c9b99f;
        }

        .category-header { 
            margin-bottom: 16px; 
            padding-bottom: 10px;
            border-bottom: 1px solid #f0e9df;
        }

        .category-header-top {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .category-header h3 { 
            margin: 0; 
            color: var(--primary-forest); 
            font-size: 1.15em; 
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tip { 
            font-size: 0.75em; 
            color: var(--primary-forest); 
            background: var(--accent-gold-light); 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-weight: 600;
            border: 1px solid #ecd8b4;
        }

        .cat-reset-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-line);
            padding: 4px 10px;
            font-size: 0.75em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .cat-reset-btn:hover {
            background: #fdf7f7;
            color: #d9534f;
            border-color: #d9534f;
        }
        
        .sub-tip {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        /* 플레이어별 상세 입력 카드 */
        .player-card {
            background: #faf7f2;
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .player-card:last-child { margin-bottom: 0; }

        .player-card-header {
            font-size: 0.92em;
            font-weight: 700;
            color: var(--primary-forest);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-preview {
            font-size: 0.9em;
            color: var(--accent-gold);
            font-weight: 700;
            background: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #ecd8b4;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .input-grid.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .input-group {
            background: #fff;
            border: 1.5px solid var(--border-line);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--primary-forest);
        }

        .input-group label {
            display: block;
            font-size: 0.75em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .score-input { 
            width: 100%; 
            padding: 6px; 
            text-align: center; 
            border: 1px solid transparent; 
            border-radius: 6px; 
            font-size: 1.05em;
            font-weight: 700;
            background: #fdfbf7;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .score-input:focus {
            background: #fff;
            border-color: var(--primary-forest);
            box-shadow: 0 0 0 2px rgba(43, 63, 39, 0.08);
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-selector label {
            flex: 1;
            background: #fff;
            border: 1.5px solid var(--border-line);
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            font-size: 0.85em;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .mode-selector input { display: none; }

        .mode-selector label.active {
            background: var(--accent-gold-light);
            border-color: var(--accent-gold);
            color: var(--primary-forest);
            box-shadow: 0 2px 6px rgba(194, 142, 56, 0.15);
        }

        /* 최종 순위 섹션 */
        .total-section { 
            margin-top: 30px; 
            padding: 24px; 
            background: linear-gradient(135deg, #2b3f27 0%, #1e2c1b 100%);
            border-radius: var(--radius-card); 
            color: #fff;
            box-shadow: 0 16px 36px rgba(43, 63, 39, 0.25);
            position: relative;
            overflow: hidden;
        }

        .total-section::after {
            content: "🏆";
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 100px;
            opacity: 0.08;
            pointer-events: none;
        }

        .total-section h3 { 
            margin: 0 0 16px 0; 
            color: #f7f1e3; 
            text-align: center; 
            font-family: 'Playfair Display', serif, 'Pretendard';
            font-size: 1.35em;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 10px;
        }

        .rank-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 12px 18px; 
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
        }

        .rank-item:hover {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.12);
        }

        .rank-item:last-child { margin-bottom: 0; }

        .rank-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05em;
        }

        .rank-score {
            font-size: 1.2em;
            color: #f2cb73;
            font-family: 'Playfair Display', serif;
        }

        .footer { 
            margin-top: 30px; 
            font-size: 0.8em; 
            color: var(--text-muted); 
            text-align: center; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <div class="sub-title">Official Master Suite</div>
        <h2>하모니즈 자동 점수 계산기</h2>
        <div class="header-desc">보드게임 전문 통계 및 득점 산출 솔루션</div>
    </div>
    
    <!-- 참가자 관리 섹션 -->
    <div class="manage-section">
        <div class="manage-title">👥 참가자 엔트리 관리</div>
        <div class="player-add-row">
            <input type="text" id="newPlayerName" class="name-input" placeholder="참가자 닉네임 입력" onkeypress="if(event.key === 'Enter') addPlayer()">
            <button class="add-btn" onclick="addPlayer()">참가 등록</button>
        </div>
        <div id="playerTagList" class="player-tag-list"></div>
    </div>

    <div class="action-bar">
        <button class="reset-btn" onclick="resetData()">전체 데이터 초기화</button>
    </div>

    <!-- 각 그룹별 점수 입력 섹션 -->
    <div id="categoriesContainer"></div>

    <!-- 실시간 순위 리포트 섹션 -->
    <div id="totalResults" class="total-section"></div>
</div>

<div class="footer">Harmonies Master Suite · Designed for Board Gamers</div>

<script>
    let players = [];
    
    const categories = [
        { key: 'tree', name: '🌲 나무 그룹', tip: '층별 높이별 입력' },
        { key: 'mountain', name: '⛰️ 산 그룹', tip: '층별 높이별 입력' },
        { key: 'field', name: '🌾 들판 그룹', tip: '노랑토큰 2개 이상 (곳당 5점)' },
        { key: 'water', name: '💧 물 그룹', tip: 'A강길 / B섬 모드 선택' },
        { key: 'building', name: '🏠 건물 그룹', tip: '건물당 5점 산출' },
        { key: 'animal', name: '🐾 동물 카드', tip: '조건 달성 합산 점수' },
        { key: 'spirit', name: '✨ 정령 카드 (확장)', tip: '조건 달성 합산 점수' }
    ];

    window.onload = function() {
        players = [];
        render();
    };

    function addPlayer() {
        let input = document.getElementById('newPlayerName');
        let name = input.value.trim();
        if (!name) {
            name = "참가자 " + (players.length + 1);
        }
        
        let pid = Date.now() + Math.random();
        let initialScores = {
            tree: { f0: '', f1: '', f2: '', f3: '' },
            mountain: { f0: '', f1: '', f2: '', f3: '' },
            field: '',
            waterMode: 'A',
            waterLines: '',
            waterIsland: '',
            building: '',
            animal: '',
            spirit: ''
        };
        
        players.push({ pid: pid, name: name, scores: initialScores });
        input.value = '';
        render();
    }

    function removePlayer(pid) {
        players = players.filter(p => p.pid !== pid);
        render();
    }

    function updatePlayerName(pid, newName) {
        let player = players.find(p => p.pid === pid);
        if (player) {
            player.name = newName.trim() || "무명";
            updateResults();
        }
    }

    function resetCategory(catKey) {
        if (confirm(`"${categories.find(c => c.key === catKey).name}" 부문의 모든 기록을 초기화하시겠습니까?`)) {
            players.forEach(p => {
                if (catKey === 'tree' || catKey === 'mountain') {
                    p.scores[catKey] = { f0: '', f1: '', f2: '', f3: '' };
                } else if (catKey === 'water') {
                    p.scores.waterLines = '';
                    p.scores.waterIsland = '';
                } else {
                    p.scores[catKey] = '';
                }
            });
            render();
        }
    }

    function updateSubScore(pid, catKey, subKey, val) {
        let player = players.find(p => p.pid === pid);
        if (player) {
            player.scores[catKey][subKey] = val;
            updatePreview(pid, catKey);
            updateResults();
        }
    }

    function updateDirectScore(pid, catKey, val) {
        let player = players.find(p => p.pid === pid);
        if (player) {
            player.scores[catKey] = val;
            updatePreview(pid, catKey);
            updateResults();
        }
    }

    function updateWaterMode(pid, mode) {
        let player = players.find(p => p.pid === pid);
        if (player) {
            player.scores.waterMode = mode;
            let container = document.getElementById(`water-inputs-${pid}`);
            if (container) {
                container.innerHTML = getWaterInputsHtml(player);
            }
            updatePreview(pid, 'water');
            updateResults();
        }
    }

    function calculateCategoryScore(p, catKey) {
        let s = p.scores;
        let total = 0;

        if (catKey === 'tree' || catKey === 'mountain') {
            let target = s[catKey];
            if (target) {
                let f0 = parseInt(target.f0) || 0;
                let f1 = parseInt(target.f1) || 0;
                let f2 = parseInt(target.f2) || 0;
                let f3 = parseInt(target.f3) || 0;
                total += (f0 * 0) + (f1 * 1) + (f2 * 3) + (f3 * 7);
            }
        } else if (catKey === 'field') {
            total += (parseInt(s.field) || 0) * 5;
        } else if (catKey === 'water') {
            if (s.waterMode === 'A') {
                let lines = parseInt(s.waterLines) || 0;
                let wScore = 0;
                if (lines === 1) wScore = 0;
                else if (lines === 2) wScore = 2;
                else if (lines === 3) wScore = 5;
                else if (lines === 4) wScore = 8;
                else if (lines === 5) wScore = 11;
                else if (lines === 6) wScore = 15;
                else if (lines >= 7) {
                    wScore = 15 + (lines - 6) * 4;
                }
                total += wScore;
            } else {
                let island = parseInt(s.waterIsland) || 0;
                total += island * 5;
            }
        } else if (catKey === 'building') {
            total += (parseInt(s.building) || 0) * 5;
        } else if (catKey === 'animal') {
            total += (parseInt(s.animal) || 0);
        } else if (catKey === 'spirit') {
            total += (parseInt(s.spirit) || 0) * 1;
        }

        return total;
    }

    function calculatePlayerScore(p) {
        let total = 0;
        categories.forEach(cat => {
            total += calculateCategoryScore(p, cat.key);
        });
        return total;
    }

    function updatePreview(pid, catKey) {
        let player = players.find(p => p.pid === pid);
        if (player) {
            let score = calculateCategoryScore(player, catKey);
            let prevEl = document.getElementById(`preview-${catKey}-${pid}`);
            if (prevEl) {
                prevEl.innerText = `부문 합계: ${score}점`;
            }
        }
    }

    function resetData() {
        if (confirm("모든 참가자 명부와 입력된 득점 기록을 초기화하시겠습니까?")) {
            players = [];
            render();
        }
    }

    function getWaterInputsHtml(p) {
        let isA = p.scores.waterMode === 'A';
        let html = `
        <div class="mode-selector">
            <label class="${isA ? 'active' : ''}" onclick="updateWaterMode(${p.pid}, 'A')">
                <input type="radio" name="waterMode-${p.pid}" ${isA ? 'checked' : ''}> 🌊 모드 A (강길 득점표)
            </label>
            <label class="${!isA ? 'active' : ''}" onclick="updateWaterMode(${p.pid}, 'B')">
                <input type="radio" name="waterMode-${p.pid}" ${!isA ? 'checked' : ''}> 🏝️ 모드 B (섬 득점)
            </label>
        </div>
        `;
        if (isA) {
            html += `
            <div class="input-grid">
                <div class="input-group" style="grid-column: span 2;">
                    <label>완성한 강길의 총 줄 수 (자동 점수 환산)</label>
                    <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.waterLines}" oninput="updateDirectScore(${p.pid}, 'waterLines', this.value)">
                </div>
            </div>
            `;
        } else {
            html += `
            <div class="input-grid">
                <div class="input-group" style="grid-column: span 2;">
                    <label>완성한 독립된 섬 개수 (개당 5점)</label>
                    <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.waterIsland}" oninput="updateDirectScore(${p.pid}, 'waterIsland', this.value)">
                </div>
            </div>
            `;
        }
        return html;
    }

    function render() {
        let tagContainer = document.getElementById('playerTagList');
        if (players.length === 0) {
            tagContainer.innerHTML = `<div class="empty-notice" style="width:100%;">등록된 참가자가 없습니다. 상단에서 참가자 성함을 등록해주세요.</div>`;
        } else {
            let tagHtml = "";
            players.forEach(p => {
                tagHtml += `
                <div class="player-tag">
                    <span>👤</span>
                    <input type="text" value="${p.name}" oninput="updatePlayerName(${p.pid}, this.value)" title="클릭하여 이름 수정">
                    <span class="tag-del" onclick="removePlayer(${p.pid})" title="삭제">×</span>
                </div>`;
            });
            tagContainer.innerHTML = tagHtml;
        }

        let catContainer = document.getElementById('categoriesContainer');
        let catHtml = "";

        categories.forEach(cat => {
            catHtml += `
            <div class="category-section">
                <div class="category-header">
                    <div class="category-header-top">
                        <h3>${cat.name}</h3>
                        <div class="category-actions">
                            <span class="tip">${cat.tip}</span>
                            <button class="cat-reset-btn" onclick="resetCategory('${cat.key}')">그룹 초기화</button>
                        </div>
                    </div>
            `;
            
            if (cat.key === 'tree' || cat.key === 'mountain') {
                catHtml += `<div class="sub-tip">규칙 체계: 0층(0점) / 1층(1점) / 2층(3점) / 3층(7점)</div>`;
            } else if (cat.key === 'water') {
                catHtml += `<div class="sub-tip">규칙 체계: 강길(연속 길 비례 누진 환산) 또는 섬(개당 5점) 선택 적용</div>`;
            } else if (cat.key === 'spirit') {
                catHtml += `<div class="sub-tip">규칙 체계: 확장 정령 카드 조건달성</div>`;
            }

            catHtml += `
                </div>
                <div class="category-player-content">
            `;

            if (players.length === 0) {
                catHtml += `<div class="empty-notice">참가자를 등록하면 해당 부문 입력을 시작할 수 있습니다.</div>`;
            } else {
                players.forEach(p => {
                    let currentScore = calculateCategoryScore(p, cat.key);
                    catHtml += `
                    <div class="player-card">
                        <div class="player-card-header">
                            <span>🔸 ${p.name}</span>
                            <span class="calc-preview" id="preview-${cat.key}-${p.pid}">부문 합계: ${currentScore}점</span>
                        </div>
                        <div id="${cat.key === 'water' ? 'water-inputs-' + p.pid : ''}">
                    `;

                    if (cat.key === 'tree' || cat.key === 'mountain') {
                        let t = p.scores[cat.key];
                        catHtml += `
                        <div class="input-grid cols-4">
                            <div class="input-group">
                                <label>0층 (0점)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${t.f0}" oninput="updateSubScore(${p.pid}, '${cat.key}', 'f0', this.value)">
                            </div>
                            <div class="input-group">
                                <label>1층 (1점)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${t.f1}" oninput="updateSubScore(${p.pid}, '${cat.key}', 'f1', this.value)">
                            </div>
                            <div class="input-group">
                                <label>2층 (3점)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${t.f2}" oninput="updateSubScore(${p.pid}, '${cat.key}', 'f2', this.value)">
                            </div>
                            <div class="input-group">
                                <label>3층 (7점)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${t.f3}" oninput="updateSubScore(${p.pid}, '${cat.key}', 'f3', this.value)">
                            </div>
                        </div>
                        `;
                    } else if (cat.key === 'field') {
                        catHtml += `
                        <div class="input-grid">
                            <div class="input-group" style="grid-column: span 2;">
                                <label>노랑토큰 2개 이상 배치된 들판 개수 (곳당 5점)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.field}" oninput="updateDirectScore(${p.pid}, 'field', this.value)">
                            </div>
                        </div>
                        `;
                    } else if (cat.key === 'water') {
                        catHtml += getWaterInputsHtml(p);
                    } else if (cat.key === 'building') {
                        catHtml += `
                        <div class="input-grid">
                            <div class="input-group" style="grid-column: span 2;">
                                <label>건물 개수 (개당 5점 환산)</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.building}" oninput="updateDirectScore(${p.pid}, 'building', this.value)">
                            </div>
                        </div>
                        `;
                    } else if (cat.key === 'animal') {
                        catHtml += `
                        <div class="input-grid">
                            <div class="input-group" style="grid-column: span 2;">
                                <label>동물 카드 최종 합산 점수</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.animal}" oninput="updateDirectScore(${p.pid}, 'animal', this.value)">
                            </div>
                        </div>
                        `;
                    } else if (cat.key === 'spirit') {
                        catHtml += `
                        <div class="input-grid">
                            <div class="input-group" style="grid-column: span 2;">
                                <label>정령카드 조건 달성</label>
                                <input type="number" pattern="[0-9]*" inputmode="numeric" class="score-input" placeholder="0" value="${p.scores.spirit}" oninput="updateDirectScore(${p.pid}, 'spirit', this.value)">
                            </div>
                        </div>
                        `;
                    }

                    catHtml += `</div></div>`;
                });
            }

            catHtml += `
                </div>
            </div>
            `;
        });

        catContainer.innerHTML = catHtml;
        updateResults();
    }

    function updateResults() {
        let resDiv = document.getElementById('totalResults');
        if (players.length === 0) {
            resDiv.style.display = "none";
            return;
        }

        resDiv.style.display = "block";
        let results = players.map(p => {
            return { name: p.name, score: calculatePlayerScore(p) };
        }).sort((a, b) => b.score - a.score);
        
        let html = "<h3>🏆 실시간  최종 순위</h3>";
        let currentRank = 1;
        results.forEach((r, idx) => {
            if (idx > 0 && results[idx - 1].score !== r.score) {
                currentRank = idx + 1;
            }
            let medal = currentRank === 1 ? '🥇' : (currentRank === 2 ? '🥈' : (currentRank === 3 ? '🥉' : '🏅'));
            html += `
            <div class="rank-item">
                <div class="rank-info">
                    <span>${medal}</span>
                    <span><strong>${currentRank}위</strong> &nbsp;·&nbsp; ${r.name}</span>
                </div>
                <div class="rank-score">${r.score} 점</div>
            </div>`;
        });
        resDiv.innerHTML = html;
    }
</script>
</body>
</html>
