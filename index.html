<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하모니즈 점수 계산기</title>
    <style>
        :root {
            --primary-color: #34d399;
            --bg-color: #1e293b;
            --card-bg: #334155;
            --border-color: #475569;
            --text-color: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; gap: 8px;
        }

        h1 { font-size: 1.1rem; margin: 0; color: #ffffff; }

        .actions { display: flex; gap: 5px; }

        button {
            cursor: pointer; padding: 6px 12px; font-size: 0.85rem; font-weight: 600;
            border-radius: 6px; border: none;
        }

        .btn-primary { background-color: #059669; color: white; }
        .btn-danger { background-color: #94a3b8; color: #1e293b; }

        .scoreboard-summary {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; margin-bottom: 16px;
        }

        .scoreboard-summary h2 { font-size: 0.95rem; margin-top: 0; margin-bottom: 10px; color: #94a3b8; }

        .ranking-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

        .ranking-item {
            background: #475569; padding: 8px 12px; border-radius: 8px;
            min-width: 100px; flex-shrink: 0; border-left: 4px solid #cbd5e1;
        }

        .ranking-item.rank-1 { border-left-color: #eab308; background: #451a03; }
        .ranking-name { font-weight: bold; font-size: 0.8rem; }
        .ranking-score { font-size: 1.1rem; font-weight: 800; color: #fff; }

        .main-layout { display: flex; flex-direction: column; gap: 15px; }

        .group-section {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }

        .group-title {
            font-size: 0.9rem; font-weight: bold; padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
        }

        .player-score-row {
            background: #1e293b; padding: 8px 10px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; gap: 8px;
        }

        .player-name-input-inline {
            font-size: 0.85rem; font-weight: bold; border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05); color: #fff; width: 85px; padding: 4px 6px; border-radius: 4px;
        }
        .player-name-input-inline:focus {
            border-color: var(--primary-color); background: #334155; outline: none;
        }

        .inputs-group { display: flex; align-items: center; gap: 6px; }

        .inputs-group input {
            width: 50px; padding: 4px 0; text-align: center;
            background: #334155; border: 1px solid var(--border-color);
            border-radius: 4px; color: #fff; font-size: 0.85rem;
        }

        .calc-result { font-weight: bold; color: #34d399; width: 45px; text-align: right; }

        .players-manage-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }

        .players-manage-header { font-size: 0.9rem; font-weight: bold; color: #94a3b8; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

        .player-manage-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; padding: 6px 10px; border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌿 하모니즈 점수 계산기</h1>
        <div class="actions">
            <button class="btn-primary" id="add-player-btn">+ 인원 추가</button>
            <button class="btn-danger" id="reset-btn">초기화</button>
        </div>
    </header>

    <div class="scoreboard-summary">
        <h2>🏆 실시간 총합 순위</h2>
        <div class="ranking-list" id="ranking-list"></div>
    </div>

    <div class="main-layout" id="main-layout"></div>

    <div style="margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border-color); text-align: center;">
        <p style="font-size: 0.75rem; color: #94a3b8; margin: 0;">Made by 천상민</p>
    </div>
</div>

<script>
    const categories = [
        { id: 'habitat', name: '🏡 서식지 점수', color: '#34d399' },
        { id: 'animal', name: '🐾 동물 카드 점수', color: '#fbbf24' },
        { id: 'spirit', name: ' espírit(정령) / 보너스 점수', color: '#a78bfa' }
    ];

    let players = [
        { id: 1, name: '플레이어 1', values: { habitat: 0, animal: 0, spirit: 0 } },
        { id: 2, name: '플레이어 2', values: { habitat: 0, animal: 0, spirit: 0 } }
    ];

    const mainLayout = document.getElementById('main-layout');
    const rankingList = document.getElementById('ranking-list');

    function calculateTotal(player) {
        let score = 0;
        categories.forEach(cat => { score += Number(player.values[cat.id]); });
        return score;
    }

    function renderRanking() {
        const rankedPlayers = [...players].map(p => ({ ...p, total: calculateTotal(p) })).sort((a, b) => b.total - a.total);
        rankingList.innerHTML = rankedPlayers.map((p, idx) => `
            <div class="ranking-item ${idx===0 ? 'rank-1' : ''}">
                <div class="ranking-name">${idx + 1}위 · ${p.name}</div>
                <div class="ranking-score">${p.total}점</div>
            </div>
        `).join('');
    }

    function renderApp() {
        renderRanking();

        let html = '';

        // 각 점수 카테고리별 섹션 렌더링
        categories.forEach(cat => {
            html += `
                <div class="group-section">
                    <div class="group-title" style="color: ${cat.color};">${cat.name}</div>
                    ${players.map(player => `
                        <div class="player-score-row">
                            <input type="text" class="player-name-input-inline" value="${player.name}" oninput="updateName(${player.id}, this.value)">
                            <div class="inputs-group">
                                점수<input type="number" value="${player.values[cat.id]}" oninput="updateValue(${player.id}, '${cat.id}', this.value)">
                                <span class="calc-result" id="res-${player.id}-${cat.id}">${player.values[cat.id]}점</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        });

        // 인원 삭제 관리 섹션 렌더링 (인원 추가 버튼 중복 제거 및 삭제 기능만 깔끔하게 배치)
        html += `
            <div class="players-manage-card">
                <div class="players-manage-header">
                    <span>👤 플레이어 관리 (인원 삭제)</span>
                </div>
                ${players.map(player => `
                    <div class="player-manage-row">
                        <span style="font-weight: bold; font-size: 0.9rem;">${player.name}</span>
                        ${players.length > 1 ? `<button class="delete-player" onclick="deletePlayer(${player.id})" style="background:none; color:#f87171; cursor:pointer; font-weight:600;">✕ 삭제</button>` : '<span style="font-size:0.8rem; color:#94a3b8;">삭제 불가 (최소 1명)</span>'}
                    </div>
                `).join('')}
            </div>
        `;

        mainLayout.innerHTML = html;
    }

    window.updateName = (id, val) => {
        let p = players.find(p=>p.id===id);
        if(p) {
            p.name = val;
            renderRanking();
            document.querySelectorAll(`input[oninput*="updateName(${id},"]`).forEach(input => {
                if (input.value !== val) input.value = val;
            });
        }
    };

    window.updateValue = (id, cId, v) => {
        let p = players.find(p=>p.id===id); 
        p.values[cId] = v === '' ? 0 : Number(v);
        const resEl = document.getElementById(`res-${id}-${cId}`);
        if(resEl) resEl.innerText = `${p.values[cId]}점`;
        renderRanking();
    };

    window.deletePlayer = (id) => { 
        players = players.filter(p=>p.id!==id); 
        renderApp(); 
    };
    
    document.getElementById('add-player-btn').onclick = () => { 
        players.push({id:Date.now(), name:`플레이어 ${players.length + 1}`, values:{habitat: 0, animal: 0, spirit: 0}}); 
        renderApp(); 
    };
    
    document.getElementById('reset-btn').onclick = () => { if(confirm('초기화하시겠습니까?')) location.reload(); };

    renderApp();
</script>
</body>
</html>
