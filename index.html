<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>하모니즈 점수 계산기</title>
    <style>
        /* 하모니즈 테마 색상 적용 */
        :root {
            --bg-color: #fdfaf0;     /* 따뜻한 미색 배경 */
            --container-bg: #fffcf5; /* 카드 배경 */
            --accent-green: #7da56e; /* 자연 녹색 */
            --accent-blue: #6d9dbf;  /* 물/강 파란색 */
            --accent-brown: #a68a73; /* 나무/산 갈색 */
            --text-color: #5a4e44;   /* 부드러운 텍스트 */
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        .container { 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            width: 450px; 
            border: 2px solid #eaddc7;
        }

        h2 { text-align: center; color: var(--accent-green); margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { 
            width: 100%; padding: 10px; box-sizing: border-box; 
            border: 2px solid #eaddc7; border-radius: 10px; background: #fffdfa;
        }

        button { 
            width: 100%; background-color: var(--accent-green); color: white; 
            border: none; padding: 12px; border-radius: 10px; font-size: 16px; 
            cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        button:hover { background-color: #6a8e5d; }

        .result { 
            margin-top: 25px; padding: 20px; background-color: #f0f4ed; 
            border-radius: 15px; text-align: center; font-size: 20px; 
            font-weight: bold; color: var(--accent-green);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>하모니즈 점수 계산기</h2>
    <div class="input-group">
        <label>나무 점수:</label>
        <input type="number" id="tree" value="0">
    </div>
    <div class="input-group">
        <label>산 점수:</label>
        <input type="number" id="mountain" value="0">
    </div>
    <div class="input-group">
        <label>들판 점수:</label>
        <input type="number" id="field" value="0">
    </div>
    <div class="input-group">
        <label>물 점수:</label>
        <input type="number" id="water" value="0">
    </div>
    <div class="input-group">
        <label>동물 카드 점수:</label>
        <input type="number" id="animal" value="0">
    </div>
    <button onclick="calc()">점수 합산하기</button>
    <div class="result" id="res">총 점수: 0점</div>
</div>

<div class="footer">
    제작자: 천상민
</div>

<script>
    function calc() {
        let total = 0;
        ['tree', 'mountain', 'field', 'water', 'animal'].forEach(id => {
            total += parseInt(document.getElementById(id).value) || 0;
        });
        document.getElementById('res').innerText = "총 점수: " + total + "점";
    }
</script>

</body>
</html
